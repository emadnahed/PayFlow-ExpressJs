apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-api
  namespace: payflow
  labels:
    app: payflow
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payflow
      component: api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: payflow
        component: api
    spec:
      # Uncomment if using private registry
      # imagePullSecrets:
      #   - name: regcred

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: payflow
          # TODO: Replace with your actual image
          image: yourusername/payflow:v1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: payflow-config
            - secretRef:
                name: payflow-secrets

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: payflow
                topologyKey: kubernetes.io/hostname
