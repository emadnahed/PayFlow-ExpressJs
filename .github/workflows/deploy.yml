name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, staging]

jobs:
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/PayFlow
            git pull origin main
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
            echo "Production deployed: $(date)"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    environment: staging
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/PayFlow_Staging
            git pull origin staging
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml --env-file .env.staging up -d --build
            docker image prune -f
            echo "Staging deployed: $(date)"
