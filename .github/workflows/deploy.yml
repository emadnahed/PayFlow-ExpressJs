name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, staging]

jobs:
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: >
      secrets.VPS_HOST != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/PayFlow
            git pull origin main
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
            echo "Production deployed: $(date)"
            echo "Waiting for containers..."
            sleep 15
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml ps
            curl -sf http://localhost:3000/health/live && echo "Health check passed" || (echo "Health check FAILED" && exit 1)

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    if: >
      secrets.VPS_HOST != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    environment: staging
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/PayFlow_Staging
            git pull origin staging
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml --env-file .env.staging up -d --build
            docker image prune -f
            echo "Staging deployed: $(date)"
            echo "Waiting for containers..."
            sleep 15
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml ps
            curl -sf http://localhost:3001/health/live && echo "Health check passed" || (echo "Health check FAILED" && exit 1)

  smoke-test-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke tests
        run: k6 run -e ENV=staging load-testing/tests/smoke/smoke.test.js
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
