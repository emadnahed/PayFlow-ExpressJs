# ================================================
# PayFlow — Production Overrides
# ================================================
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# RAM budget: API 320M + Mongo 320M + Redis 80M = 720M limit (~510M typical)

services:
  api:
    container_name: payflow-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # --- Core (hardcoded for Docker network) ---
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/payflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # --- Required in .env.prod (validateProductionEnv will reject empty values) ---
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}
      # --- Auth ---
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - BCRYPT_POOL_SIZE=2
      # --- Cluster ---
      - CLUSTER_WORKERS=1
      # --- Rate Limiting ---
      - RATE_LIMIT_DISABLED=false
      - LOAD_TEST_SECRET=${LOAD_TEST_SECRET:-}
      # --- Logging & Observability ---
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-payflow-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
    command: ["node", "--max-old-space-size=256", "--optimize-for-size", "--gc-interval=100", "dist/cluster.js"]
    networks:
      - payflow-prod-net
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 192M

  mongo:
    container_name: payflow-mongo
    command: mongod --wiredTigerCacheSizeGB 0.25 --bind_ip_all
    networks:
      - payflow-prod-net
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 192M

  redis:
    container_name: payflow-redis
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    networks:
      - payflow-prod-net
    deploy:
      resources:
        limits:
          memory: 80M
        reservations:
          memory: 32M

networks:
  payflow-prod-net:
    driver: bridge
