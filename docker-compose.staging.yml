# ================================================
# PayFlow — Staging Overrides
# ================================================
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# RAM budget: API 192M + Mongo 192M + Redis 48M = 432M limit (~320M typical)

services:
  api:
    container_name: payflow-staging-api
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # --- Core (hardcoded for Docker network) ---
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/payflow_staging
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # --- Required in .env.staging (validateProductionEnv runs because NODE_ENV=production) ---
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # --- Auth (relaxed for staging) ---
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN:-1h}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
      - BCRYPT_POOL_SIZE=2
      # --- Rate Limiting ---
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED:-false}
      - LOAD_TEST_SECRET=${LOAD_TEST_SECRET:-}
      # --- Logging & Observability ---
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-payflow-staging-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      # --- Sentry ---
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-staging}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    command: ["node", "--max-old-space-size=128", "--optimize-for-size", "--gc-interval=100", "dist/server.js"]
    networks:
      - payflow-staging-net
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M

  mongo:
    container_name: payflow-staging-mongo
    command: mongod --wiredTigerCacheSizeGB 0.125 --bind_ip_all
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      - payflow-staging-net
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M

  redis:
    container_name: payflow-staging-redis
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 32mb
      --maxmemory-policy allkeys-lru
      --save ""
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - payflow-staging-net
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 24M

networks:
  payflow-staging-net:
    driver: bridge
